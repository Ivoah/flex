<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="grain">
            <feTurbulence type="fractalNoise" baseFrequency="1" numOctaves="10" />
            <feColorMatrix type="saturate" values="0" result="noise" />
            <feBlend mode="multiply" x="0%" y="0%" width="100%" height="100%" in="SourceGraphic" in2="noise"/>
        </filter>
    </defs>
    <rect width="100%" height="100%" fill="#222" filter="url(#grain)" />
</svg>
