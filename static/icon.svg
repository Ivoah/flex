<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="grain">
            <feTurbulence type="fractalNoise" baseFrequency="1" numOctaves="10" />
            <feColorMatrix type="saturate" values="0" result="noise" />
            <feBlend mode="multiply" x="0%" y="0%" width="100%" height="100%" in="SourceGraphic" in2="noise"/>
        </filter>
        <clipPath id="roundCorners">
            <rect x="0" y="0" width="100%" height="100%" rx="10%" />
        </clipPath>
    </defs>
    <g clip-path="url(#roundCorners)">
        <rect fill="#222" width="100%" height="100%" x="0" y="0" filter="url(#grain)" />
        <rect fill="orange" width="25%" height="100%" x="0" y="0" />
        <rect fill="orange" width="75%" height="25%" x="0" y="0" />
        <rect fill="orange" width="75%" height="25%" x="0" y="50%" />
    </g>
</svg>
